name: horas-complementares

services:
  n8n:
    image: n8nio/n8n:2.45.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORTA:-5679}:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5679/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Chave e modelo lidos pelo workflow via $env: o JSON exportado não leva credencial.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes leem prompts/, regras/ e templates/ do disco (montados read-only).
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      # Privacidade: o histórico de execuções guardaria RG, CPF e assinatura.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./prompts:/data/prompts:ro
      - ./regras:/data/regras:ro
      - ./templates:/data/templates:ro
      - ./workflows:/data/workflows:ro
    depends_on:
      gotenberg:
        condition: service_started
      declaracao:
        condition: service_healthy

  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"

  declaracao:
    build: ./services/declaracao
    restart: unless-stopped
    expose:
      - "8000"

  # Link público do formulário durante o piloto: docker compose --profile tunnel up -d
  # A URL https://<algo>.trycloudflare.com aparece em: docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
