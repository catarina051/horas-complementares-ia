name: horas-complementares

# Logs do Docker com rotação: sem isso crescem até encher o disco da VM.
x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  n8n:
    image: n8nio/n8n:2.45.7
    restart: unless-stopped
    logging: *logs
    ports:
      - "127.0.0.1:${N8N_PORTA:-5679}:5678"
    environment:
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5679/}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Chave e modelo lidos pelo workflow via $env: o JSON exportado não leva credencial.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Code nodes leem prompts/, regras/ e templates/ do disco (montados read-only).
      NODE_FUNCTION_ALLOW_BUILTIN: fs,path
      # Privacidade: o histórico de execuções guardaria RG, CPF e assinatura.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      # Os arquivos de cada execução (certificado, assinatura, PDFs) ficam num volume em memória
      # (n8n_binarios, abaixo): nunca vão para o disco nem para backups do n8n_data.
      N8N_BINARY_DATA_STORAGE_PATH: /home/node/binarios
      # Mesmo sem salvar execuções, o n8n grava e apaga linhas; o VACUUM na subida elimina os restos
      # (valores de CPF e RG) das páginas livres do SQLite.
      DB_SQLITE_VACUUM_ON_STARTUP: "true"
      # Limites de upload em MiB (o serviço Python também recusa arquivos acima de 10 MB).
      N8N_FORMDATA_FILE_SIZE_MAX: "15"
      N8N_PAYLOAD_SIZE_MAX: "16"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_binarios:/home/node/binarios
      - ./prompts:/data/prompts:ro
      - ./regras:/data/regras:ro
      - ./templates:/data/templates:ro
      - ./workflows:/data/workflows:ro
      # Patch de UMA linha no n8n 2.45.7: não sanitizar o HTML dos campos "html" do formulário, para o
      # editor de assinatura (templates/editor-assinatura.html, conteúdo nosso) rodar. É cópia do arquivo
      # dessa versão: ao trocar a imagem acima, refaça o patch (tests/patch-n8n.test.mjs e
      # scripts/implantar.sh barram versões diferentes).
      - ./n8n/patches/utils.js:/usr/local/lib/node_modules/n8n/node_modules/n8n-nodes-base/dist/nodes/Form/utils/utils.js:ro
    depends_on:
      gotenberg:
        condition: service_started
      declaracao:
        condition: service_healthy

  # Apaga arquivos de execução com mais de 30 min no volume em memória (sobram quando uma
  # execução falha no meio). Reiniciar a VM também apaga tudo.
  limpeza:
    image: alpine:3.20
    restart: unless-stopped
    logging: *logs
    volumes:
      - n8n_binarios:/binarios
    command: ["sh", "-c", "while true; do find /binarios -type f -mmin +30 -delete; find /binarios -mindepth 1 -type d -empty -delete; sleep 300; done"]

  gotenberg:
    image: gotenberg/gotenberg:8.39.0
    logging: *logs
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"

  declaracao:
    build: ./services/declaracao
    restart: unless-stopped
    logging: *logs
    # Sem porta publicada: só o n8n fala com este serviço, pela rede interna do compose.
    # A prévia do recorte com IA chega pelo webhook /webhook/assinatura-ia do n8n.
    environment:
      # Usada só quando o aluno escolhe preparar a assinatura com IA.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    expose:
      - "8000"

  # Link público do formulário durante o piloto: docker compose --profile tunnel up -d
  # A URL https://<algo>.trycloudflare.com aparece em: docker compose logs cloudflared
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://n8n:5678
    depends_on:
      - n8n

volumes:
  n8n_data:
  n8n_binarios:
    driver: local
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=512m,uid=1000,gid=1000,mode=0700" }
